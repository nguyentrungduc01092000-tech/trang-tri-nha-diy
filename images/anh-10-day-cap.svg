<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Mặt sau bàn làm việc với dây cáp đi gọn theo mép bàn, kẹp giữ dây và hộp giấu ổ cắm dưới gầm bàn</title>
  <desc id="svgDesc">Sơ đồ minh họa được vẽ riêng cho website: dây màn hình, dây sạc laptop và dây sạc điện thoại đi gọn dọc mép sau bàn, giữ bằng kẹp dán, chui xuống khay giấu ổ cắm dưới gầm bàn, rồi đi theo một chân bàn xuống ổ cắm trên tường.</desc>
  <rect x="0" y="0" width="800" height="560" fill="#f7f3ec"/>
  <!-- Tường -->
  <rect x="0" y="0" width="800" height="330" fill="#e8e2d4"/>
  <text x="30" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4a4238">Mặt sau bàn làm việc — nhìn từ phía sau</text>
  <!-- Ổ cắm trên tường -->
  <rect x="640" y="300" width="90" height="60" rx="6" fill="#ffffff" stroke="#4a4238" stroke-width="2"/>
  <circle cx="665" cy="330" r="7" fill="#4a4238"/>
  <circle cx="705" cy="330" r="7" fill="#4a4238"/>
  <text x="640" y="385" font-family="sans-serif" font-size="15" fill="#4a4238">Ổ cắm trên tường</text>
  <!-- Mặt bàn -->
  <rect x="80" y="180" width="640" height="26" rx="4" fill="#b98a56" stroke="#7a5a34" stroke-width="2"/>
  <text x="90" y="172" font-family="sans-serif" font-size="15" fill="#4a4238">Mép sau mặt bàn</text>
  <!-- Chân bàn -->
  <rect x="110" y="206" width="22" height="260" fill="#8a6a42" stroke="#7a5a34" stroke-width="2"/>
  <rect x="668" y="206" width="22" height="260" fill="#8a6a42" stroke="#7a5a34" stroke-width="2"/>
  <text x="660" y="490" font-family="sans-serif" font-size="15" fill="#4a4238">Chân bàn</text>
  <!-- Dây cáp dọc mép sau bàn -->
  <path d="M 250 180 C 250 150, 420 150, 420 180" fill="none" stroke="#2b6cb0" stroke-width="5"/>
  <path d="M 330 180 C 330 140, 520 140, 520 180" fill="none" stroke="#c05621" stroke-width="5"/>
  <path d="M 470 180 C 470 155, 600 155, 600 180" fill="none" stroke="#276749" stroke-width="5"/>
  <text x="255" y="130" font-family="sans-serif" font-size="15" fill="#2b6cb0">Dây màn hình</text>
  <text x="380" y="118" font-family="sans-serif" font-size="15" fill="#c05621">Dây sạc laptop</text>
  <text x="520" y="140" font-family="sans-serif" font-size="15" fill="#276749">Dây sạc điện thoại</text>
  <!-- Kẹp dán giữ dây -->
  <rect x="300" y="172" width="26" height="18" rx="4" fill="#4a4238"/>
  <rect x="440" y="172" width="26" height="18" rx="4" fill="#4a4238"/>
  <rect x="570" y="172" width="26" height="18" rx="4" fill="#4a4238"/>
  <text x="300" y="215" font-family="sans-serif" font-size="14" fill="#4a4238">Kẹp dán giữ dây dọc mép sau bàn</text>
  <!-- Dây đi xuống khay giấu ổ cắm -->
  <path d="M 420 206 C 420 250, 420 250, 420 268" fill="none" stroke="#2b6cb0" stroke-width="5"/>
  <path d="M 520 206 C 520 250, 520 250, 520 268" fill="none" stroke="#c05621" stroke-width="5"/>
  <!-- Khay / hộp giấu ổ cắm dưới gầm bàn -->
  <rect x="330" y="268" width="260" height="70" rx="8" fill="#ffffff" stroke="#4a4238" stroke-width="2"/>
  <rect x="360" y="292" width="70" height="26" rx="4" fill="#e2e8f0" stroke="#4a4238" stroke-width="1.5"/>
  <rect x="450" y="292" width="70" height="26" rx="4" fill="#e2e8f0" stroke="#4a4238" stroke-width="1.5"/>
  <circle cx="375" cy="305" r="4" fill="#4a4238"/>
  <circle cx="395" cy="305" r="4" fill="#4a4238"/>
  <circle cx="465" cy="305" r="4" fill="#4a4238"/>
  <circle cx="485" cy="305" r="4" fill="#4a4238"/>
  <text x="330" y="362" font-family="sans-serif" font-size="15" fill="#4a4238">Khay giấu ổ cắm và cục sạc dưới gầm bàn</text>
  <!-- Dây từ khay xuống chân bàn rồi tới ổ tường -->
  <path d="M 590 338 L 679 338 L 679 300" fill="none" stroke="#4a4238" stroke-width="5"/>
  <text x="560" y="440" font-family="sans-serif" font-size="15" fill="#4a4238">Một đường dây duy nhất đi xuống chân bàn tới ổ cắm</text>
  <!-- Ghi chú -->
  <text x="30" y="530" font-family="sans-serif" font-size="14" font-style="italic" fill="#6b6257">Sơ đồ minh họa được vẽ riêng cho website — dây thừa cuộn gọn và buộc bằng dây velcro trong khay.</text>
</svg>
