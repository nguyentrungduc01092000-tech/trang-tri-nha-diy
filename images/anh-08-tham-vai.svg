<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img">
<title>Thảm tròn bện từ các dải vải nhiều màu và túi vải đựng đồ làm từ áo phông cũ</title>
<rect x="0" y="0" width="640" height="400" fill="#f7f3ea"/>
<rect x="30" y="330" width="580" height="14" fill="#d9c9a8"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">Thảm tròn bện vải và túi vải đựng đồ từ quần áo cũ</text>
<!-- Tham tron ben vai: cac vong tron dong tam nhieu mau -->
<circle cx="200" cy="200" r="130" fill="#e88ca0"/>
<circle cx="200" cy="200" r="108" fill="#f2c94c"/>
<circle cx="200" cy="200" r="86" fill="#5b7fa6"/>
<circle cx="200" cy="200" r="64" fill="#8ec9a7"/>
<circle cx="200" cy="200" r="42" fill="#e88ca0"/>
<circle cx="200" cy="200" r="20" fill="#f2c94c"/>
<circle cx="200" cy="200" r="130" fill="none" stroke="#7a5c3e" stroke-width="3"/>
<path d="M 200 70 A 130 130 0 0 1 310 150" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14 10"/>
<path d="M 200 92 A 108 108 0 0 1 292 168" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14 10"/>
<text x="200" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">Thảm tròn bện từ dải vải nhiều màu</text>
<!-- Tui vai dung do -->
<path d="M 430 150 L 430 300 Q 430 320 450 320 L 560 320 Q 580 320 580 300 L 580 150 L 545 150 Q 545 110 505 110 Q 465 110 465 150 Z" fill="#7fb3d5" stroke="#3d6a8a" stroke-width="3"/>
<path d="M 465 150 Q 465 110 505 110 Q 545 110 545 150" fill="none" stroke="#3d6a8a" stroke-width="3"/>
<rect x="445" y="170" width="120" height="14" fill="#e88ca0"/>
<rect x="445" y="200" width="120" height="14" fill="#f2c94c"/>
<rect x="445" y="230" width="120" height="14" fill="#8ec9a7"/>
<circle cx="505" cy="285" r="16" fill="#ffffff" stroke="#3d6a8a" stroke-width="2"/>
<text x="505" y="375" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">Túi vải đựng đồ từ áo phông cũ</text>
</svg>
