<text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">Khung ảnh bằng băng washi</text>
<text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">Khung washi treo bằng dây — chỉ dùng cho ảnh giấy nhẹ</text>
<text x="320" y="358" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">4 dải washi quanh bốn mép • 2 lỗ ở góc trên để luồn dây</text>
