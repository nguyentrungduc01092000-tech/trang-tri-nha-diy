<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Sơ đồ minh họa bàn làm việc nhỏ với đèn bàn đặt ở phía trái, đầu đèn chếch xuống mặt bàn chiếu sáng sách vở, laptop đặt bên phải không bị vệt chói">
  <title>Đèn bàn đặt đúng hướng tay thuận trên bàn làm việc nhỏ</title>
  <rect x="0" y="0" width="800" height="600" fill="#f7f3ea"/>
  <!-- tường -->
  <rect x="0" y="0" width="800" height="330" fill="#efe8d8"/>
  <!-- cửa sổ bên trái -->
  <rect x="60" y="40" width="150" height="180" fill="#cfe3ee" stroke="#8a7a5f" stroke-width="4"/>
  <line x1="135" y1="40" x2="135" y2="220" stroke="#8a7a5f" stroke-width="3"/>
  <line x1="60" y1="130" x2="210" y2="130" stroke="#8a7a5f" stroke-width="3"/>
  <text x="135" y="250" font-family="sans-serif" font-size="18" fill="#5a4f3d" text-anchor="middle">Cửa sổ</text>
  <!-- mặt bàn -->
  <rect x="40" y="330" width="720" height="26" fill="#b98d5e" stroke="#8a6a42" stroke-width="2"/>
  <rect x="90" y="356" width="18" height="170" fill="#8a6a42"/>
  <rect x="692" y="356" width="18" height="170" fill="#8a6a42"/>
  <!-- đèn bàn phía trái (đối diện tay phải) -->
  <rect x="150" y="330" width="70" height="14" fill="#3f5a73"/>
  <rect x="180" y="215" width="10" height="115" fill="#3f5a73"/>
  <line x1="185" y1="215" x2="255" y2="160" stroke="#3f5a73" stroke-width="8" stroke-linecap="round"/>
  <polygon points="255,160 300,150 285,195 240,195" fill="#e8a13c" stroke="#b97a1e" stroke-width="2"/>
  <!-- vùng sáng chiếu xuống sách -->
  <polygon points="255,160 420,330 330,330 245,185" fill="#f7dd8a" opacity="0.55"/>
  <!-- sách vở ở giữa -->
  <rect x="330" y="300" width="150" height="30" fill="#ffffff" stroke="#7a6a55" stroke-width="2"/>
  <line x1="350" y1="310" x2="460" y2="310" stroke="#9a8a70" stroke-width="2"/>
  <line x1="350" y1="320" x2="450" y2="320" stroke="#9a8a70" stroke-width="2"/>
  <rect x="345" y="278" width="120" height="22" fill="#dce8f2" stroke="#7a6a55" stroke-width="2"/>
  <!-- laptop bên phải -->
  <rect x="540" y="250" width="150" height="82" fill="#4a4a4a" stroke="#333333" stroke-width="2"/>
  <rect x="552" y="262" width="126" height="58" fill="#a8c8e0"/>
  <rect x="520" y="330" width="190" height="10" fill="#4a4a4a"/>
  <!-- hộp bút -->
  <rect x="480" y="295" width="34" height="35" fill="#7a9e7e" stroke="#557a5a" stroke-width="2"/>
  <line x1="488" y1="295" x2="486" y2="275" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <line x1="497" y1="295" x2="497" y2="272" stroke="#2980b9" stroke-width="5" stroke-linecap="round"/>
  <line x1="506" y1="295" x2="509" y2="276" stroke="#e8a13c" stroke-width="5" stroke-linecap="round"/>
  <!-- chú thích -->
  <text x="185" y="120" font-family="sans-serif" font-size="20" font-weight="bold" fill="#3f5a73" text-anchor="middle">Đèn đặt phía trái</text>
  <text x="185" y="146" font-family="sans-serif" font-size="16" fill="#5a4f3d" text-anchor="middle">(đối diện tay phải)</text>
  <text x="615" y="215" font-family="sans-serif" font-size="18" fill="#5a4f3d" text-anchor="middle">Laptop không bị</text>
  <text x="615" y="238" font-family="sans-serif" font-size="18" fill="#5a4f3d" text-anchor="middle">vệt chói</text>
  <text x="400" y="575" font-family="sans-serif" font-size="18" fill="#5a4f3d" text-anchor="middle">Đầu đèn chếch xuống mặt bàn, ánh sáng chiếu lên sách vở</text>
</svg>
