<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Sơ đồ so sánh cùng một phòng nhỏ với hai cách sơn tường: bên trái tường màu tối làm phòng trông chật và tối, bên phải tường màu sáng và trần cùng màu nhạt làm phòng trông sáng và rộng hơn">
  <title id="title">So sánh cùng một phòng nhỏ sơn tường màu tối và sơn tường màu sáng</title>
  <desc id="desc">Bên trái là phòng sơn tường màu tối: tường tối, trần trắng tương phản mạnh, phòng trông chật và tối. Bên phải là cùng một phòng sơn tường màu sáng, trần cùng màu nhạt với tường: phòng trông sáng và rộng hơn. Cả hai bên đều có cùng một cửa sổ, một chiếc giường và một chiếc bàn.</desc>
  <rect x="0" y="0" width="800" height="600" fill="#f7f3ea"/>
  <text x="400" y="36" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">Cùng một phòng nhỏ — hai cách sơn tường</text>

  <!-- Phòng bên trái: tường tối -->
  <rect x="30" y="60" width="350" height="380" fill="#5a4a52" stroke="#333333" stroke-width="3"/>
  <rect x="30" y="60" width="350" height="50" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <text x="205" y="92" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#333333">Trần trắng</text>
  <rect x="60" y="170" width="80" height="110" fill="#3a2f45" stroke="#222222" stroke-width="3"/>
  <line x1="100" y1="170" x2="100" y2="280" stroke="#222222" stroke-width="2"/>
  <line x1="60" y1="225" x2="140" y2="225" stroke="#222222" stroke-width="2"/>
  <text x="60" y="160" font-family="sans-serif" font-size="17" fill="#f0e8e0">Cửa sổ nhỏ</text>
  <rect x="180" y="300" width="160" height="70" fill="#6b5a6e" stroke="#222222" stroke-width="3"/>
  <rect x="180" y="300" width="160" height="22" fill="#e8e0d8" stroke="#222222" stroke-width="2"/>
  <text x="260" y="352" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#f0e8e0">Giường</text>
  <rect x="60" y="330" width="90" height="10" fill="#3a2f45" stroke="#222222" stroke-width="2"/>
  <line x1="68" y1="340" x2="68" y2="380" stroke="#222222" stroke-width="3"/>
  <line x1="142" y1="340" x2="142" y2="380" stroke="#222222" stroke-width="3"/>
  <text x="60" y="400" font-family="sans-serif" font-size="17" fill="#f0e8e0">Bàn</text>
  <text x="205" y="480" font-family="sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#7a2e2e">Tường màu tối</text>
  <text x="205" y="510" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555555">Phòng trông chật và tối,</text>
  <text x="205" y="536" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555555">trần trắng tạo đường ranh rõ rệt</text>

  <!-- Phòng bên phải: tường sáng -->
  <rect x="420" y="60" width="350" height="380" fill="#f2ead8" stroke="#8a7f6a" stroke-width="3"/>
  <rect x="420" y="60" width="350" height="50" fill="#f2ead8" stroke="#8a7f6a" stroke-width="3"/>
  <text x="595" y="92" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#6b5a3a">Trần cùng màu nhạt với tường</text>
  <rect x="450" y="170" width="80" height="110" fill="#bfe3f0" stroke="#4a6b7a" stroke-width="3"/>
  <line x1="490" y1="170" x2="490" y2="280" stroke="#4a6b7a" stroke-width="2"/>
  <line x1="450" y1="225" x2="530" y2="225" stroke="#4a6b7a" stroke-width="2"/>
  <circle cx="472" cy="195" r="16" fill="#ffd94d" stroke="#d9a400" stroke-width="2"/>
  <text x="450" y="160" font-family="sans-serif" font-size="17" fill="#333333">Cửa sổ</text>
  <line x1="530" y1="200" x2="640" y2="230" stroke="#e8a100" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="530" y1="250" x2="640" y2="280" stroke="#e8a100" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="570" y="300" width="160" height="70" fill="#c9b896" stroke="#8a7f6a" stroke-width="3"/>
  <rect x="570" y="300" width="160" height="22" fill="#ffffff" stroke="#8a7f6a" stroke-width="2"/>
  <text x="650" y="352" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#333333">Giường</text>
  <rect x="450" y="330" width="90" height="10" fill="#8a6b4a" stroke="#8a7f6a" stroke-width="2"/>
  <line x1="458" y1="340" x2="458" y2="380" stroke="#8a6b4a" stroke-width="3"/>
  <line x1="532" y1="340" x2="532" y2="380" stroke="#8a6b4a" stroke-width="3"/>
  <text x="450" y="400" font-family="sans-serif" font-size="17" fill="#333333">Bàn</text>
  <text x="595" y="480" font-family="sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#2e6b2e">Tường màu sáng</text>
  <text x="595" y="510" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555555">Phòng trông sáng và rộng hơn,</text>
  <text x="595" y="536" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555555">không còn đường ranh giữa tường và trần</text>

  <text x="400" y="580" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#555555">Diện tích thật không đổi — chỉ cảm giác về phòng thay đổi.</text>
</svg>
