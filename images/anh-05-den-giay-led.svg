<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img">
<title>Sơ đồ minh họa: đèn lồng giấy hình hộp dùng dây LED chạy pin, hộp pin đặt ngoài đèn, giấy cách xa bóng đèn</title>
<rect x="0" y="0" width="640" height="400" fill="#f7f3ea"/>
<rect x="220" y="80" width="200" height="200" fill="#fff3d6" stroke="#c89b6d" stroke-width="3"/>
<polygon points="270,140 285,170 320,175 295,198 303,232 270,215 237,232 245,198 220,175 255,170" fill="#f2c94c"/>
<circle cx="320" cy="180" r="14" fill="#f2c94c"/>
<circle cx="360" cy="230" r="10" fill="#f2c94c"/>
<circle cx="280" cy="240" r="10" fill="#f2c94c"/>
<path d="M 320 180 Q 340 230 360 230" stroke="#e8a13c" stroke-width="3" fill="none"/>
<path d="M 320 180 Q 300 240 280 240" stroke="#e8a13c" stroke-width="3" fill="none"/>
<rect x="420" y="300" width="90" height="50" fill="#5b7fa6"/>
<text x="465" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff">HỘP PIN</text>
<path d="M 420 320 L 350 300" stroke="#333" stroke-width="3"/>
<text x="320" y="60" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">Đèn lồng giấy — chỉ dùng đèn LED chạy pin</text>
<text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#c0392b">Giấy cách xa bóng đèn — tắt đèn khi ra khỏi nhà</text>
</svg>
