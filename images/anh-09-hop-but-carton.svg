<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Hộp đựng bút chia ngăn và khay để bàn hai tầng bằng bìa carton</title>
  <desc id="svgDesc">Sơ đồ minh họa tự vẽ: hộp đựng bút chia ba ngăn và khay để bàn hai tầng bằng bìa carton đặt trên mặt bàn, bên cạnh là khay đựng giấy tờ.</desc>
  <rect x="0" y="0" width="1200" height="800" fill="#f7f3ea"/>
  <!-- tường -->
  <rect x="0" y="0" width="1200" height="560" fill="#f2e8d5"/>
  <!-- mặt bàn -->
  <rect x="0" y="560" width="1200" height="240" fill="#c9a876"/>
  <rect x="0" y="560" width="1200" height="10" fill="#a9855a"/>
  <!-- chân bàn -->
  <rect x="60" y="570" width="26" height="230" fill="#a9855a"/>
  <rect x="1114" y="570" width="26" height="230" fill="#a9855a"/>

  <!-- ===== Khay đựng giấy tờ (bên trái) ===== -->
  <!-- giấy trong khay -->
  <rect x="130" y="400" width="220" height="150" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <rect x="145" y="420" width="190" height="8" fill="#c8c8c8"/>
  <rect x="145" y="440" width="190" height="8" fill="#c8c8c8"/>
  <rect x="145" y="460" width="150" height="8" fill="#c8c8c8"/>
  <rect x="145" y="480" width="190" height="8" fill="#c8c8c8"/>
  <!-- thành sau khay giấy -->
  <rect x="120" y="380" width="240" height="180" fill="#b98d5f"/>
  <rect x="120" y="380" width="240" height="180" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- thành trước thấp -->
  <rect x="120" y="500" width="240" height="60" fill="#d9b380"/>
  <rect x="120" y="500" width="240" height="60" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- vách ngăn giữa -->
  <rect x="232" y="400" width="10" height="160" fill="#a87c4e"/>
  <text x="240" y="600" font-family="sans-serif" font-size="26" fill="#5a4632" text-anchor="middle">Khay đựng giấy tờ</text>

  <!-- ===== Hộp đựng bút chia 3 ngăn (giữa) ===== -->
  <!-- thân hộp -->
  <rect x="470" y="380" width="260" height="180" fill="#c89a67"/>
  <rect x="470" y="380" width="260" height="180" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- vách ngăn chữ T -->
  <rect x="556" y="380" width="8" height="180" fill="#a87c4e"/>
  <rect x="556" y="470" width="90" height="8" fill="#a87c4e"/>
  <!-- bút trong các ngăn -->
  <rect x="495" y="290" width="14" height="110" fill="#3f7fbf" stroke="#2c5a8a" stroke-width="2"/>
  <rect x="520" y="270" width="14" height="130" fill="#c94f4f" stroke="#8a2f2f" stroke-width="2"/>
  <rect x="585" y="300" width="14" height="100" fill="#4da64d" stroke="#2f6b2f" stroke-width="2"/>
  <rect x="610" y="280" width="14" height="120" fill="#e0a83c" stroke="#9a7420" stroke-width="2"/>
  <rect x="680" y="310" width="14" height="90" fill="#7a5fb5" stroke="#52408a" stroke-width="2"/>
  <!-- thước kẻ trong ngăn -->
  <rect x="700" y="320" width="18" height="80" fill="#f2d06b" stroke="#9a7420" stroke-width="2"/>
  <!-- nhãn ngăn -->
  <rect x="485" y="520" width="60" height="26" fill="#fff7e0" stroke="#8a6a42" stroke-width="2"/>
  <text x="515" y="539" font-family="sans-serif" font-size="18" fill="#5a4632" text-anchor="middle">Bút</text>
  <rect x="580" y="520" width="60" height="26" fill="#fff7e0" stroke="#8a6a42" stroke-width="2"/>
  <text x="610" y="539" font-family="sans-serif" font-size="18" fill="#5a4632" text-anchor="middle">Thước</text>
  <rect x="665" y="520" width="55" height="26" fill="#fff7e0" stroke="#8a6a42" stroke-width="2"/>
  <text x="692" y="539" font-family="sans-serif" font-size="18" fill="#5a4632" text-anchor="middle">Tẩy</text>
  <text x="600" y="600" font-family="sans-serif" font-size="26" fill="#5a4632" text-anchor="middle">Hộp đựng bút chia 3 ngăn</text>

  <!-- ===== Khay để bàn hai tầng (bên phải) ===== -->
  <!-- trụ góc -->
  <rect x="830" y="400" width="16" height="160" fill="#a87c4e" stroke="#8a6a42" stroke-width="2"/>
  <rect x="1074" y="400" width="16" height="160" fill="#a87c4e" stroke="#8a6a42" stroke-width="2"/>
  <!-- tầng dưới -->
  <rect x="820" y="500" width="280" height="60" fill="#c89a67"/>
  <rect x="820" y="500" width="280" height="60" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- sổ tay tầng dưới -->
  <rect x="850" y="450" width="90" height="50" fill="#5a7fbf" stroke="#3c5a8a" stroke-width="2"/>
  <rect x="960" y="460" width="110" height="40" fill="#e8e0d0" stroke="#8a6a42" stroke-width="2"/>
  <!-- tầng trên -->
  <rect x="820" y="380" width="280" height="22" fill="#d9b380"/>
  <rect x="820" y="380" width="280" height="22" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- thành tầng trên -->
  <rect x="820" y="330" width="280" height="52" fill="#c89a67"/>
  <rect x="820" y="330" width="280" height="52" fill="none" stroke="#8a6a42" stroke-width="3"/>
  <!-- giấy nháp tầng trên -->
  <rect x="850" y="290" width="120" height="45" fill="#ffffff" stroke="#d8cfc0" stroke-width="2"/>
  <rect x="860" y="302" width="100" height="6" fill="#c8c8c8"/>
  <rect x="860" y="316" width="80" height="6" fill="#c8c8c8"/>
  <!-- phong bì tầng trên -->
  <rect x="990" y="300" width="90" height="38" fill="#f2e3c8" stroke="#8a6a42" stroke-width="2"/>
  <text x="960" y="600" font-family="sans-serif" font-size="26" fill="#5a4632" text-anchor="middle">Khay để bàn hai tầng</text>

  <!-- chú thích chất liệu -->
  <text x="600" y="700" font-family="sans-serif" font-size="24" fill="#5a4632" text-anchor="middle">Cả ba món đều gấp từ tấm bìa carton phẳng, dán bằng keo nến và keo sữa</text>
  <text x="600" y="740" font-family="sans-serif" font-size="22" fill="#7a6a55" text-anchor="middle">Để xa cốc nước — bìa carton sợ nước, chỉ đựng đồ khô và đồ nhẹ</text>
</svg>
