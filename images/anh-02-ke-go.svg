<text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#333">Kệ sách ba tầng từ ván gỗ cũ</text>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">Ván đã rút đinh, chà nhám — kiểm tra chắc chắn trước khi xếp sách đầy</text>
</svg>
