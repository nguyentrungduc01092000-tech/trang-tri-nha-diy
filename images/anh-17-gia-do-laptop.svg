<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Sơ đồ minh họa giá đỡ laptop nghiêng bằng bìa carton nhiều lớp đặt cạnh giá đỡ gỗ thừa dạng khung thưa, laptop đặt trên giá đỡ gỗ, các khe thoát nhiệt ở mặt dưới để hở">
  <title>Giá đỡ laptop nghiêng bằng bìa carton và gỗ thừa</title>
  <rect x="0" y="0" width="800" height="600" fill="#f5f0e6"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#333333">Giá đỡ laptop nghiêng: bìa carton và gỗ thừa</text>
  <!-- Gia do carton ben trai -->
  <text x="190" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333333">Giá carton nhiều lớp</text>
  <polygon points="70,420 310,420 310,380 90,300" fill="#d9b380" stroke="#8a6d4b" stroke-width="4"/>
  <polygon points="90,300 310,380 310,340 110,270" fill="#c69c6d" stroke="#8a6d4b" stroke-width="3"/>
  <rect x="80" y="420" width="230" height="30" fill="#b98d5f" stroke="#8a6d4b" stroke-width="3"/>
  <rect x="100" y="360" width="14" height="60" fill="#8a6d4b"/>
  <rect x="190" y="335" width="14" height="85" fill="#8a6d4b"/>
  <rect x="270" y="360" width="14" height="60" fill="#8a6d4b"/>
  <text x="190" y="480" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">Mặt trước thấp, mặt sau cao</text>
  <!-- Gia do go ben phai + laptop -->
  <text x="590" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#333333">Giá gỗ thừa dạng khung thưa</text>
  <polygon points="470,430 700,430 700,400 490,330" fill="#a9743f" stroke="#6b4423" stroke-width="4"/>
  <rect x="480" y="430" width="210" height="24" fill="#8a5a2e" stroke="#6b4423" stroke-width="3"/>
  <rect x="500" y="380" width="16" height="50" fill="#6b4423"/>
  <rect x="650" y="355" width="16" height="75" fill="#6b4423"/>
  <!-- Laptop tren gia go -->
  <polygon points="480,330 710,330 680,230 510,230" fill="#4a6fa5" stroke="#2e4a6b" stroke-width="4"/>
  <polygon points="510,230 680,230 670,200 520,200" fill="#6b8fc0" stroke="#2e4a6b" stroke-width="3"/>
  <rect x="500" y="330" width="180" height="10" fill="#333333"/>
  <!-- Khe thoat nhiet -->
  <text x="590" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">Khoảng trống ở giữa: khe thoát nhiệt để hở</text>
  <text x="590" y="548" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Không che kín lỗ thoát nhiệt của laptop</text>
  <text x="190" y="510" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555555">Kiểm tra độ chắc trước khi đặt laptop</text>
<text x="590" y="115" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">Tâm màn hình thấp hơn tầm mắt 15–20°</text>
</svg>
